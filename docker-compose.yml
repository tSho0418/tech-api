services:
  db:
    image: postgres:16-alpine
    container_name: tech-db
    environment:
      POSTGRES_DB: itnews
      POSTGRES_USER: itnews
      POSTGRES_PASSWORD: itnews
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itnews"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Docker ネットワーク内では localhost ではなくサービス名 "db" で接続する
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/itnews
      SPRING_DATASOURCE_USERNAME: itnews
      SPRING_DATASOURCE_PASSWORD: itnews
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  frontend:
    build:
      context: ../tech-front
      dockerfile: Dockerfile
    container_name: tech-front
    ports:
      - "3000:3000"
    env_file:
      - ../tech-front/.env.local
    depends_on:
      - backend
    volumes:
      - ../tech-front:/app
      - /app/node_modules

volumes:
  postgres_data:
